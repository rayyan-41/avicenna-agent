[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avicenna-agent"
version = "1.0.0"
description = "Avicenna: TUI Note-Generation Harness for Obsidian Vaults"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "mistralai>=1.0.0",
    "textual>=0.79,<1.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "mypy"]
gemini = ["google-genai>=0.3.0"]

[project.scripts]
avicenna = "avicenna.cli.app:main"

[tool.setuptools.packages.find]
include = ["avicenna*"]

[tool.setuptools.package-data]
avicenna = ["tui/*.tcss"]
