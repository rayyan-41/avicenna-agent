[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avicenna-agent"
version = "2.0.0"
description = "Avicenna: agent harness for Obsidian vaults, with a TypeScript TUI frontend"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "mistralai>=1.0.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    # Imported by avicenna/secrets.py. It was undeclared, and because the
    # import sits behind a try/except the failure was invisible: a clean
    # install silently fell back to storing the API key in plain JSON while
    # the README promised the OS keyring.
    "keyring>=24.0",
    # Imported directly by avicenna/providers/mistral.py to identify timeout
    # exceptions in the error mapper.  Available transitively through
    # mistralai, but an undeclared transitive import is a latent breakage: if
    # mistralai ever changes transport, the import fails at module load and
    # the entire provider stops loading.
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# types-PyYAML is a gate dependency, not a convenience: `mypy --strict` fails
# with "Library stubs not installed for yaml" without it.  It went undeclared
# because it happened to be present in a developer environment, and CI never
# reached the type-check step to say otherwise.
dev = ["pytest", "pytest-asyncio", "mypy", "types-PyYAML"]
# The `gemini` extra is gone with the code that used it. It existed solely for
# MCPClientManager.get_gemini_tools, which had no callers and imported a vendor
# SDK outside avicenna/providers/ — a boundary the provider layer exists to hold.

[project.scripts]
avicenna = "avicenna.cli.app:main"

[tool.setuptools.packages.find]
include = ["avicenna*"]

[tool.pytest.ini_options]
# pytest-asyncio 1.x needs this or bare `async def test_` silently never runs.
# Three tests in test_providers.py were failing for exactly this reason.
asyncio_mode = "auto"
testpaths = ["tests"]
# The repository root has to be importable: three test modules import from
# `scripts/`, which is not a package and is not installed by `pip install -e`.
# Without this, whether the suite runs at all depended on how it was invoked --
# `python -m pytest` puts the working directory on sys.path and passed, bare
# `pytest` does not and failed collection outright.  CI runs the bare form, so
# its Tests step aborted during collection and ran ZERO tests for a dozen
# commits while every local run was green.
pythonpath = ["."]

# keyring genuinely ships no type stubs (there is no types-keyring on PyPI).
# This override is scoped to that one package; every other missing import
# remains an error.
[[tool.mypy.overrides]]
module = "keyring.*"
ignore_missing_imports = true
